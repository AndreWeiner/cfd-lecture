project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - notebooks/lecture_00.qmd
    - notebooks/lecture_01.py
    - notebooks/lecture_02.py
    - notebooks/lecture_03.py
    - notebooks/exercise_01.py
    - notebooks/exercise_02.py
    - notebooks/exercise_03.py
  resources:
    - videos/*.mp4
    - notebooks/media/pde-*.mp4
    - notebooks/media/fd-*.mp4
    - notebooks/media/fd-*.webm
    - notebooks/media/euler-characteristic-modes-*.mp4
    - notebooks/media/euler-physical-perturbations-*.mp4
    - notebooks/media/euler-dependence-build-*.mp4
    - notebooks/*.py
    - requirements.txt
    - .nojekyll
    - images/TUD*.svg

website:
  title: Computational Fluid Dynamics
  navbar:
    logo:
      light:
        path: images/TUD_Logo_RGB_horizontal_schwarz_en.svg
        alt: TU Dresden — Dresden University of Technology
      dark:
        path: images/TUD-white.svg
        alt: TU Dresden — Dresden University of Technology
    left:
      - href: index.qmd
        text: Course overview
  sidebar:
    style: docked
    search: true
    contents:
      - href: index.qmd
        text: Overview
      - section: Lectures and exercises
        contents:
          - notebooks/lecture_00.qmd
          - section: Introduction to CFD
            contents:
              - href: notebooks/lecture_01.py
                text: Lecture
              - href: notebooks/exercise_01.py
                text: Practice
          - section: Transport phenomena and classification
            contents:
              - href: notebooks/lecture_02.py
                text: Lecture
              - href: notebooks/exercise_02.py
                text: Practice
          - section: Finite difference method foundations
            contents:
              - href: notebooks/lecture_03.py
                text: Lecture
              - href: notebooks/exercise_03.py
                text: Practice

format:
  html:
    theme:
      dark: [darkly, theme-dark.scss]
      light: cosmo
    respect-user-color-scheme: false
    toc: true
    code-copy: true
    code-overflow: scroll
    css: quarto.css

execute:
  freeze: auto
  warning: false
  error: false
  daemon: false

lang: en
